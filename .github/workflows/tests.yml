name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Principle of least privilege — each job declares only what it needs
permissions: {}

# A newer push to the same branch supersedes an in-flight run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Run the test suite across every supported Python version
  # ---------------------------------------------------------------------------
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        # numpy is imported directly by tests/test_searcher.py. The heavier
        # sentence-transformers extra is deliberately not installed: the
        # vector-search tests skip without it, and pulling torch would
        # dominate CI time for no extra coverage.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" numpy

      - name: Run tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Job 1: Lint — one run is enough, no need to repeat it per Python version
  # ---------------------------------------------------------------------------
  lint:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests

  # ---------------------------------------------------------------------------
  # Job 2: Build the distributions and prove the artifact actually works
  #
  # The suite runs with pytest's `pythonpath = ["src"]`, so it imports from the
  # source tree and passes even when the built wheel is empty — which is
  # exactly how a wheel containing nothing but .dist-info metadata shipped
  # unnoticed. This job installs the wheel into a clean environment and
  # exercises it there, so a packaging regression fails CI instead of a
  # release.
  # ---------------------------------------------------------------------------
  package:
    name: build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert the distributions contain the package
        shell: python
        run: |
          import glob, sys, tarfile, zipfile

          wheel = glob.glob("dist/*.whl")[0]
          modules = [
              n for n in zipfile.ZipFile(wheel).namelist()
              if n.startswith("mkdocs_mcp/") and n.endswith(".py")
          ]
          print(f"{wheel}: {len(modules)} module(s)")
          if not modules:
              print("::error::wheel contains no mkdocs_mcp modules — check [tool.hatch.build.targets.wheel]")
              sys.exit(1)

          sdist = glob.glob("dist/*.tar.gz")[0]
          sources = [
              n for n in tarfile.open(sdist).getnames()
              if "/src/mkdocs_mcp/" in n and n.endswith(".py")
          ]
          print(f"{sdist}: {len(sources)} module(s)")
          if not sources:
              print("::error::sdist contains no mkdocs_mcp sources")
              sys.exit(1)

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install --upgrade pip
          /tmp/wheel-env/bin/python -m pip install dist/*.whl pytest pytest-asyncio numpy

      - name: Import every module from the installed wheel
        run: |
          /tmp/wheel-env/bin/python - <<'PY'
          import importlib
          for name in (
              "config", "exclusions", "indexer", "models",
              "repository", "searcher", "server", "utils",
          ):
              module = importlib.import_module(f"mkdocs_mcp.{name}")
              assert "site-packages" in module.__file__, module.__file__
          print("all modules import from site-packages")
          PY

      - name: Run the console entry point
        run: /tmp/wheel-env/bin/papermoon-mkdocs-mcp --help

      - name: Run the test suite against the installed package
        # Clearing pythonpath stops pytest putting src/ ahead of site-packages,
        # so this exercises the shipped artifact rather than the source tree.
        run: /tmp/wheel-env/bin/python -m pytest -q --override-ini "pythonpath="
