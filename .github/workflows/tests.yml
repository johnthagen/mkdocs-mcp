name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Principle of least privilege — each job declares only what it needs
permissions: {}

# A newer push to the same branch supersedes an in-flight run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 0: Run the test suite across every supported Python version
  # ---------------------------------------------------------------------------
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        # numpy is imported directly by tests/test_searcher.py. The heavier
        # sentence-transformers extra is deliberately not installed: the
        # vector-search tests skip without it, and pulling torch would
        # dominate CI time for no extra coverage.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" numpy

      - name: Run tests
        run: pytest -q

  # ---------------------------------------------------------------------------
  # Job 1: Lint — one run is enough, no need to repeat it per Python version
  # ---------------------------------------------------------------------------
  lint:
    name: ruff
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check src tests
